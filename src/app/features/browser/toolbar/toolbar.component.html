<div class="flex items-center gap-2 px-3 py-2 bg-gray-900 border-b border-gray-800 flex-shrink-0">
  <!-- Nav buttons -->
  <div class="flex gap-1">
    <button
      class="w-7 h-7 flex items-center justify-center text-gray-500 hover:text-white hover:bg-gray-800 rounded text-base leading-none"
      title="Back"
    >&#8592;</button>
    <button
      class="w-7 h-7 flex items-center justify-center text-gray-500 hover:text-white hover:bg-gray-800 rounded text-base leading-none"
      title="Forward"
    >&#8594;</button>
    <button
      class="w-7 h-7 flex items-center justify-center text-gray-500 hover:text-white hover:bg-gray-800 rounded text-base leading-none"
      title="Refresh"
    >&#8635;</button>
  </div>

  <!-- URL input -->
  <input
    type="text"
    [(ngModel)]="urlInput"
    (keydown)="onKeydown($event)"
    placeholder="Enter URL or search..."
    class="flex-1 bg-gray-800 text-gray-100 text-sm px-3 py-1.5 rounded border border-gray-700 focus:border-blue-500 focus:outline-none placeholder-gray-600"
  />

  <button
    (click)="go()"
    class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-sm rounded transition-colors"
  >Go</button>

  <ng-content />
</div>
